buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["FaceRecognitionSdk_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["FaceRecognitionSdk_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["FaceRecognitionSdk_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.facefullsdk"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")

  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

def bundledAar = file("${projectDir}/libs/facefullsdk.aar")
if (!bundledAar.exists() && findProject(":libfacefullsdk") == null) {
  bundledAar.parentFile.mkdirs()
  def zipFile = file("${projectDir}/libs/facefullsdk-android.zip")
  try {
    new URL("https://github.com/identixia-IDV/FaceRecognition-LivenessDetection-Android/releases/latest/download/facefullsdk-android.zip").withInputStream { input ->
      zipFile.withOutputStream { out -> out << input }
    }
    copy {
      from zipTree(zipFile)
      into file("${projectDir}/libs")
    }
  } catch (Exception ignored) {
    // The dependency block below reports a missing AAR.
  }
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  if (bundledAar.exists()) {
    // Prefer files() over flatDir — flatDir has no POM metadata and fails
    // resolution for :app > :face-recognition-sdk on AGP 8+.
    implementation files(bundledAar)
  } else {
    // Monorepo example: example/android/libfacefullsdk/ via settings.gradle
    implementation project(path: ':libfacefullsdk')
  }
}


// Engine packs (.xdb) are not inside the AAR — stage as assets/facefullsdk/
// so every consumer APK (example) can init (same pattern as Flutter plugin).
def _ixDbCandidates = []
if (findProject(":libfacefullsdk") != null) {
  _ixDbCandidates << file("${findProject(":libfacefullsdk").projectDir}/databases")
}
_ixDbCandidates << file("${projectDir}/libs/databases")
_ixDbCandidates << file("${projectDir}/../example/android/libfacefullsdk/databases")
def _ixDbSrc = _ixDbCandidates.find { it != null && it.isDirectory() && it.listFiles()?.any { f -> f.name.endsWith(".xdb") } }
if (_ixDbSrc != null) {
  def _ixPacksOut = file("${projectDir}/build/generated/identixiaAssets")
  def _ixDest = file("${_ixPacksOut}/facefullsdk")
  _ixDest.mkdirs()
  _ixDbSrc.eachFileMatch(~/.*\.xdb/) { src ->
    def out = new File(_ixDest, src.name)
    if (!out.exists() || out.length() != src.length()) {
      java.nio.file.Files.copy(src.toPath(), out.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
  }
  android.sourceSets.main.assets.srcDir(_ixPacksOut)
  println("[identixia] staged face packs from ${_ixDbSrc} -> assets/facefullsdk")
}

